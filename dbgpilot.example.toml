# Copy to dbgpilot.toml, or use: dbgpilot serve --config dbgpilot.example.toml
# Local roots are resolved on the server. Use an explicit host path here when
# clients send host paths to a server running inside a container.
# See docs/python-setup.md for all settings and precedence.

[connection]
url = "http://127.0.0.1:9004"
timeout = 35
# token_env = "PROJECT_DEBUG_TOKEN"

[startup]
launch = false
timeout = 10
# python = ".venv/bin/python"
# working_directory = "."

[listener]
host = "127.0.0.1"
port = 9004
xdebug_host = "127.0.0.1"
xdebug_port = 9003

[[path_mappings]]
local = "."
remote = "file:///var/www/html"

# Add more roots for shared libraries or a different mount:
# [[path_mappings]]
# local = "/work/shared"
# remote = "file:///opt/shared"
